<title>منصة ميجا ميتال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a demo control bar on top, then one surface — packages, public site, admin dashboard, or client portal. Single light brand look, Arabic RTL by default with an English LTR switch. */
:root {
  --ink: #0F1B2A; --ink-2: #3D4957; --line: #DCE1E7; --line-2: #C3CBD5;
  --bg: #F2F4F6; --surface: #FFFFFF; --sky: #EAF6FF; --sky-line: #CDE5F6;
  --blue: #1E6FD9; --blue-ink: #0E3F82; --blue-soft: #E8F0FB;
  --green: #17703C; --green-soft: #E6F4EC; --green-ink: #145C33; --wa: #1F9D55;
  --amber-soft: #FFF1DC; --amber-ink: #6B3A00; --red: #A33A2A; --red-soft: #FCEDEA; --red-ink: #8C2A1C;
  --violet-soft: #EFEAFB; --violet-ink: #45318F;
  --bar: #0B1420; --bar-2: #17263A; --bar-ink: #C9D3DF;
  --font: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
  color-scheme: light; direction: rtl;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.7; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0; }
p { margin: 0; }
a { color: var(--blue); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
[dir="ltr"] .flip { transform: scaleX(-1); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.container { max-width: 1240px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums; }

/* Demo bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bar); color: var(--bar-ink); border-bottom: 1px solid #22344B; }
.bar-in { padding-block: 10px; display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.bar-label { font-size: 12px; font-weight: 600; color: #8FA3BA; }
.seg { display: inline-flex; background: var(--bar-2); border-radius: 8px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--bar-ink); padding: 7px 12px; border-radius: 6px; font-size: 14px; font-weight: 500; min-height: 38px; }
.seg button[aria-pressed="true"] { background: #FFFFFF; color: var(--ink); font-weight: 700; }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.seg.tabs button { font-size: 15px; padding: 8px 18px; }
.push { margin-inline-start: auto; }
.addon { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #FFFFFF; min-height: 38px; }
.addon input { width: 20px; height: 20px; accent-color: var(--blue); }
.addon.off { opacity: .4; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; transition: opacity .25s, background .25s; }
.chip.on { background: #163A2A; color: #9BE3B9; }
.chip.off { background: transparent; color: #6E7F94; text-decoration: line-through; border: 1px dashed #3A4C62; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: #FFFFFF; padding: 12px 18px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; box-shadow: 0 6px 24px rgba(15,27,42,.25); }

/* Shared */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 6px; font-weight: 700; font-size: 15px; padding: 12px 20px; min-height: 46px; border: 0; text-decoration: none; }
.btn.primary { background: var(--blue); color: #FFFFFF; }
.btn.wa { background: var(--wa); color: #FFFFFF; }
.btn.ghost { background: #FFFFFF; color: var(--ink); border: 1px solid var(--line-2); }
.btn.light { background: #FFFFFF; color: var(--ink); }
.btn.outline-light { background: transparent; color: #FFFFFF; border: 1.5px solid #FFFFFF; }
.btn.danger { color: var(--red); }
.btn.sm { padding: 6px 12px; min-height: 38px; font-size: 13px; white-space: nowrap; }
.btn:disabled { background: var(--line-2); color: var(--ink-2); cursor: not-allowed; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; display: inline-block; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
.section { padding-block: 64px 24px; display: flex; flex-direction: column; gap: 26px; }
.eyebrow { font-size: 14px; font-weight: 600; color: var(--blue); }
.h2 { font-size: clamp(26px, 4vw, 38px); font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; text-align: start; padding: 0; color: var(--ink); }
.card img { width: 100%; height: 210px; object-fit: cover; display: block; }
.card .in { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.card h3 { font-size: 19px; }
.count { font-size: 12px; color: #1557B0; background: var(--blue-soft); padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: clamp(18px, 4vw, 36px); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { border: 1px solid var(--line-2); background: #FFFFFF; color: var(--ink); padding: 8px 14px; border-radius: 999px; font-size: 14px; min-height: 42px; }
.pill[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; border-color: var(--ink); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
.field input, .field select, .field textarea { font-weight: 400; padding: 11px 12px; border: 1px solid var(--line-2); border-radius: 6px; background: #FFFFFF; color: var(--ink); min-width: 0; }
.ltr-in { direction: ltr; text-align: start; }
[dir="rtl"] .ltr-in { text-align: right; }
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 12px 14px; text-align: start; border-top: 1px solid #EEF1F4; }
thead th { background: #F7F9FB; border-top: 0; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.yes { display: inline-flex; width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: #FFFFFF; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.no { color: #8C99A8; }
.part { font-size: 12px; font-weight: 700; background: var(--amber-soft); color: var(--amber-ink); padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; display: inline-block; }
.t2 { background: var(--blue-soft); color: var(--blue-ink); }
.t3 { background: var(--green-soft); color: var(--green-ink); }
.tx { background: var(--violet-soft); color: var(--violet-ink); }
.ok { background: var(--green-soft); color: var(--green-ink); border: 1px solid #B7DEC6; border-radius: 6px; padding: 11px 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; text-align: start; color: var(--ink); min-height: 72px; }
.stat[aria-pressed="true"] { border: 2px solid var(--ink); }
.stat strong { font-size: 22px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr)); gap: 10px; }
.locked { max-width: 560px; margin: 64px auto; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* Site */
.site-head { background: var(--sky); border-bottom: 1px solid var(--sky-line); }
.site-head .container { padding-block: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.logo { height: 92px; width: auto; display: block; }
.nav { display: flex; flex-wrap: wrap; gap: 6px 22px; font-weight: 500; }
.nav button { background: none; border: 0; padding: 8px 0; color: var(--ink); font-size: 16px; }
.nav button.cur { color: var(--blue); font-weight: 700; }
.lang { background: #FFFFFF; border: 1px solid var(--line-2); color: var(--ink); border-radius: 6px; padding: 9px 14px; min-height: 44px; font-weight: 700; }
.hero { position: relative; background: var(--ink); color: #FFFFFF; overflow: hidden; }
.hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .5; }
.hero .container { position: relative; padding-block: 92px 84px; display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
.hero h1 { font-size: clamp(34px, 6vw, 60px); }
.hero .sub { font-size: 15px; letter-spacing: 3px; color: #9CC2F5; font-weight: 500; }
.hero p { font-size: 19px; color: #E3E8EE; max-width: 640px; }
.hero .kicker { background: var(--blue); color: #FFFFFF; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 4px; }
.band { background: var(--ink); color: #FFFFFF; margin-top: 56px; }
.band .container { padding-block: 64px; display: flex; flex-direction: column; gap: 30px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 18px; }
.step { background: var(--bar-2); border-radius: 8px; overflow: hidden; }
.step img { width: 100%; height: 160px; object-fit: cover; display: block; }
.step div { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 4px; }
.track { background: var(--blue-soft); border-color: #C5D8F3; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: space-between; }
.track ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; flex: 1 1 300px; }
.track li { display: flex; gap: 12px; align-items: center; }
.dot { flex: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.d-done { background: var(--green); color: #FFFFFF; }
.d-cur { background: var(--blue); color: #FFFFFF; box-shadow: 0 0 0 4px #CFE2FA; }
.d-next { background: #FFFFFF; border: 2px solid #A9BCD6; color: var(--ink-2); }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form .full { grid-column: 1 / -1; }
.foot { background: #0B1420; color: var(--bar-ink); margin-top: 24px; }
.foot .container { padding-block: 28px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 14px; }
.crumbs { font-size: 14px; color: #B9C6D6; display: flex; flex-wrap: wrap; gap: 8px; }
.crumbs button { background: none; border: 0; padding: 0; color: #B9C6D6; text-decoration: underline; }
.photo { position: relative; border-radius: 8px; overflow: hidden; background: var(--ink); margin: 0; }
.photo img { width: 100%; height: 280px; object-fit: cover; display: block; }
.photo figcaption { position: absolute; bottom: 10px; inset-inline-start: 10px; color: #FFFFFF; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 4px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 16px; }
.facts span { display: block; font-size: 13px; color: var(--ink-2); }
.wa-float { position: fixed; inset-inline-end: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 50%; background: var(--wa); color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(15,27,42,.25); z-index: 8; border: 0; }

/* Packages */
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 20px; align-items: stretch; }
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.plan.best { border: 2px solid var(--blue); }
.plan .ribbon { position: absolute; top: -13px; inset-inline-start: 20px; background: var(--blue); color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px; }
.plan .lvl { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.plan h2 { font-size: 23px; }
.price { padding-block: 12px; border-top: 1px solid #EEF1F4; border-bottom: 1px solid #EEF1F4; display: flex; flex-direction: column; gap: 4px; }
.price strong { font-size: 28px; font-variant-numeric: tabular-nums; }
.price strong small { font-size: 14px; font-weight: 500; }
.plan ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; font-size: 14px; }
.plan li { display: flex; gap: 8px; align-items: flex-start; line-height: 1.55; }
.ic { flex: none; width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; margin-top: 1px; }
.ic.y { background: var(--green); color: #FFFFFF; }
.ic.n { background: #EEF1F4; color: #8C99A8; }
.plan li.dim { color: #8C99A8; }
.spec td { text-align: center; }
.spec .grp th { background: #F7F9FB; font-weight: 700; color: var(--ink); font-size: 14px; }
.spec .best-col { background: #F5F9FE; }
.addons > div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid #EEF1F4; }
.addons > div:first-child { border-top: 0; }

/* Admin */
.admin { display: flex; flex-wrap: wrap; align-items: stretch; min-height: 80vh; }
.side { flex: 1 1 230px; background: var(--surface); border-inline-end: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 18px; }
.side > img { height: 70px; width: auto; align-self: flex-start; }
.side nav { display: flex; flex-direction: column; gap: 4px; }
.side nav button { display: flex; align-items: center; gap: 10px; background: none; border: 0; text-align: start; padding: 11px 12px; border-radius: 6px; color: var(--ink); font-size: 15px; min-height: 44px; }
.side nav button[aria-current="page"] { background: var(--blue-soft); color: var(--blue-ink); font-weight: 700; }
.side nav .n { margin-inline-start: auto; background: #C26A00; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 0 8px; border-radius: 999px; }
.user-chip { margin-top: auto; font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 12px; }
.main { flex: 999 1 600px; min-width: 0; max-width: 100%; padding: 26px clamp(16px, 3vw, 32px) 48px; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; }
.head h1 { font-size: 28px; }
.cols { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
.cols > * { min-width: 0; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; background: var(--line); }
.thumbs img, .thumbs .empty { width: 100%; height: 90px; object-fit: cover; display: block; }
.thumbs .empty { background: #F7F9FB; color: #6A7686; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.pcard .in { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.slot { position: relative; height: 110px; border-radius: 6px; overflow: hidden; }
.slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slot.add { border: 1.5px dashed #8C99A8; background: #F7F9FB; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; cursor: pointer; text-align: center; }
.slot.add input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.slot .x { position: absolute; top: 6px; inset-inline-end: 6px; background: rgba(15,27,42,.85); color: #FFFFFF; border: 0; border-radius: 4px; font-size: 12px; padding: 2px 8px; }
.slot .cov, .slot .mk { position: absolute; top: 6px; inset-inline-start: 6px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; border: 0; }
.slot .cov { background: var(--blue); color: #FFFFFF; }
.slot .mk { background: rgba(15,27,42,.85); color: #FFFFFF; font-size: 12px; font-weight: 500; }
.slot.is-cover { outline: 3px solid var(--blue); outline-offset: -3px; }
.typegrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.typegrid button { text-align: start; padding: 10px 12px; border: 1px solid var(--line-2); background: #FFFFFF; border-radius: 6px; min-height: 44px; font-size: 14px; color: var(--ink); }
.typegrid button[aria-pressed="true"] { border: 2px solid var(--blue); background: var(--blue-soft); color: var(--blue-ink); font-weight: 700; }
.lvlbox { border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.lvl3 { background: #F2FAF5; border: 1px solid #B7DEC6; }
.lvl4 { background: #F6F3FE; border: 1px solid #D7CCF5; }
.lead { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.lead .pic { position: relative; }
.lead .pic img { width: 100%; height: 140px; object-fit: cover; display: block; }
.ttl { position: absolute; top: 8px; inset-inline-start: 8px; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 4px; background: rgba(15,27,42,.85); }
.ttl.urgent { background: var(--red); }
.lead .in { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.row-item { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; gap: 12px; align-items: center; }
.row-item img { width: 64px; height: 64px; border-radius: 6px; object-fit: cover; flex: none; }
.row-item .in { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.chart { overflow-x: auto; padding-bottom: 28px; }
.plot { position: relative; height: 240px; margin-top: 16px; min-width: 420px; margin-inline-start: 60px; border-bottom: 1px solid var(--line-2); }
.gl { position: absolute; inset-inline: 0; border-top: 1px dashed #E3E8EE; }
.gl span { position: absolute; inset-inline-start: -60px; top: -10px; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 14px; padding-inline: 8px; }
.bcol { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; position: relative; }
.bcol i { display: block; width: 100%; max-width: 54px; background: var(--blue); border-radius: 4px 4px 0 0; }
.bcol .mon { position: absolute; bottom: -24px; }
.bcol:hover i { filter: brightness(1.12); }

/* Portal */
.phone { max-width: 420px; margin: 28px auto 48px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: 0 10px 40px rgba(15,27,42,.08); }
.phone-head { background: var(--sky); border-bottom: 1px solid var(--sky-line); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.phone-head img { height: 46px; width: auto; }
.phone-body { padding: 22px 18px; display: flex; flex-direction: column; gap: 16px; background: var(--bg); min-height: 560px; }
.otp { letter-spacing: 14px; text-align: center !important; font-size: 24px !important; font-weight: 700 !important; direction: ltr; }
.hint { background: #FFFFFF; border: 1px dashed #A9BCD6; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); }
.err { background: var(--red-soft); color: var(--red-ink); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.prog { flex: 1; height: 8px; background: #E3E8EE; border-radius: 999px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--blue); border-radius: 999px; }
.pstages { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 12px; }
.pstages li { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pgal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pgal figure { margin: 0; position: relative; border-radius: 8px; overflow: hidden; }
.pgal img { width: 100%; height: 120px; object-fit: cover; display: block; }
.pgal figcaption { position: absolute; inset: auto 0 0 0; background: rgba(15,27,42,.82); color: #FFFFFF; font-size: 11px; padding: 4px 8px; }
.upd { list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid var(--line); border-radius: 10px; }
.upd li { padding: 11px 14px; border-top: 1px solid #EEF1F4; display: flex; flex-direction: column; gap: 2px; }
.upd li:first-child { border-top: 0; }
.payrow { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid #EEF1F4; }

/* ===== Brand site v2: palette taken from the logo (blues #305490 → #3C6CB4 → #609CD8, steel #484854 → #909090) ===== */
:root {
  --navy: #0B1A30; --navy-2: #12284A; --navy-3: #071222;
  --b-deep: #264C8A; --brand: #3C6CB4; --brand-2: #4878C0; --b-light: #609CD8; --b-ice: #A9CBEE;
  --b-mist: #EDF3FB; --b-mist-2: #D9E6F5;
  --steel: #484F5A; --steel-2: #8F96A0; --spark: #F0A04B;
  --barH: 0px; --slant: clamp(28px, 5vw, 64px);
}
.zone { padding-block: clamp(64px, 9vw, 120px); position: relative; background: var(--sbg, #fff); }
.zone.sl::before { content: ""; position: absolute; inset-inline: 0; bottom: calc(100% - 1px); height: var(--slant); background: var(--sbg, #fff); clip-path: polygon(0 100%, 100% 0, 100% 100%); pointer-events: none; }
[dir="ltr"] .zone.sl::before { clip-path: polygon(0 0, 100% 100%, 0 100%); }
.z-navy { --sbg: var(--navy); color: #fff; }
.z-mist { --sbg: var(--b-mist); }
.z-white { --sbg: #fff; }
.z-brand { --sbg: var(--b-deep); color: #fff; background: radial-gradient(70% 90% at 15% 0%, rgba(96,156,216,.35), transparent 60%), linear-gradient(135deg, var(--b-deep), var(--brand)); }
.glow { background: radial-gradient(55% 60% at 85% 0%, rgba(96,156,216,.22), transparent 70%), radial-gradient(40% 50% at 0% 100%, rgba(60,108,180,.25), transparent 70%), var(--sbg); }
.kick { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .5px; color: var(--brand); }
.kick::before { content: ""; width: 28px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--b-light), var(--brand)); }
.z-navy .kick, .z-brand .kick { color: var(--b-ice); }
.z-navy .kick::before, .z-brand .kick::before { background: linear-gradient(90deg, var(--b-light), #fff); }
.ttl2 { font-size: clamp(30px, 4.6vw, 52px); font-weight: 700; line-height: 1.2; letter-spacing: -.3px; }
.ttl2 em { font-style: normal; background: linear-gradient(90deg, var(--brand), var(--b-light)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.z-navy .ttl2 em, .z-brand .ttl2 em { background: linear-gradient(90deg, var(--b-ice), #fff); -webkit-background-clip: text; background-clip: text; }
.lead2 { font-size: 17px; color: var(--ink-2); max-width: 620px; }
.z-navy .lead2, .z-brand .lead2 { color: #C9D6E6; }
.shead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 32px; margin-bottom: clamp(28px, 4vw, 48px); }
.shead > div { display: flex; flex-direction: column; gap: 12px; }
.link-go { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 8px 0; font-weight: 700; font-size: 15px; color: var(--brand); }
.z-navy .link-go { color: var(--b-ice); }
.link-go svg { transition: transform .2s; }
.link-go:hover svg { transform: translateX(-4px); }
[dir="ltr"] .link-go:hover svg { transform: scaleX(-1) translateX(-4px); }
.btn.brand { background: linear-gradient(135deg, var(--brand), var(--b-deep)); color: #fff; box-shadow: 0 8px 22px rgba(38,76,138,.35); transition: transform .2s, box-shadow .2s, filter .2s; }
.btn.brand:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 12px 28px rgba(38,76,138,.45); }
.btn.glass { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(6px); }
.btn.glass:hover { background: rgba(255,255,255,.16); }
.lz { opacity: 0; transition: opacity .5s; }
.lz.ld { opacity: 1; }
.skel { background: linear-gradient(100deg, var(--navy-2) 30%, #1B3762 50%, var(--navy-2) 70%); background-size: 300% 100%; animation: shimmer 1.6s linear infinite; }
@keyframes shimmer { to { background-position: -150% 0; } }
.rv { opacity: 0; transform: translateY(22px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); transition-delay: var(--d, 0ms); }
.rv.in { opacity: 1; transform: none; }
#app.fade { animation: appIn .28s ease; }
@keyframes appIn { from { opacity: 0; transform: translateY(8px); } }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .28s; }

/* Header */
.sh { position: sticky; top: var(--barH); z-index: 7; background: rgba(255,255,255,.95); backdrop-filter: blur(12px); transition: box-shadow .25s; }
.sh::after { content: ""; position: absolute; inset-inline: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--b-deep), var(--brand) 45%, var(--b-light) 75%, var(--steel-2)); }
.sh .container { display: flex; align-items: center; gap: 16px 24px; padding-block: 10px 13px; }
.sh .logo { height: 84px; transition: height .25s; }
.sh.scrolled { box-shadow: 0 10px 30px rgba(11,26,48,.10); }
.sh.scrolled .logo { height: 56px; }
.sh nav { display: flex; gap: 2px; margin-inline-start: auto; }
.sh nav button { background: none; border: 0; padding: 10px 14px; font-size: 15.5px; font-weight: 500; color: var(--navy); position: relative; min-height: 44px; }
.sh nav button::after { content: ""; position: absolute; inset-inline: 14px; bottom: 4px; height: 2px; border-radius: 2px; background: var(--brand); transform: scaleX(0); transition: transform .2s; }
.sh nav button:hover::after, .sh nav button.cur::after { transform: scaleX(1); }
.sh nav button.cur { color: var(--brand); font-weight: 700; }
.sh .acts { display: flex; gap: 8px; align-items: center; }
.burger { display: none; width: 46px; height: 46px; border-radius: 8px; border: 1px solid var(--b-mist-2); background: #fff; color: var(--navy); align-items: center; justify-content: center; margin-inline-start: auto; }
.mmenu { border-top: 1px solid var(--b-mist-2); background: #fff; padding: 8px 16px 16px; display: flex; flex-direction: column; }
.mmenu button.mi { background: none; border: 0; border-bottom: 1px solid #EEF2F7; text-align: start; padding: 14px 4px; font-size: 17px; font-weight: 600; color: var(--navy); min-height: 52px; }
.mmenu .row { margin-top: 14px; }
.mmenu .row .btn { flex: 1; }

/* Hero */
.hx { position: relative; min-height: clamp(560px, 88vh, 880px); background: var(--navy); color: #fff; overflow: hidden; display: flex; align-items: center; }
.hx-bg { position: absolute; inset: -6% 0; }
.hx-bg img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: luminosity; opacity: .55; will-change: transform; }
.hx::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(270deg, rgba(11,26,48,.96) 10%, rgba(11,26,48,.7) 45%, rgba(38,76,138,.35) 100%), radial-gradient(50% 60% at 80% 30%, rgba(96,156,216,.35), transparent 70%); background-blend-mode: normal; }
.hx .hx-fade { position: absolute; inset: auto 0 0 0; height: 45%; z-index: 1; background: linear-gradient(0deg, rgba(11,26,48,.92), transparent); }
[dir="ltr"] .hx::before { background: linear-gradient(90deg, rgba(11,26,48,.96) 10%, rgba(11,26,48,.7) 45%, rgba(38,76,138,.35) 100%), radial-gradient(50% 60% at 20% 30%, rgba(96,156,216,.35), transparent 70%); }
.hx::after { content: ""; position: absolute; inset: 0; z-index: 1; opacity: .5; background: repeating-linear-gradient(115deg, transparent 0 120px, rgba(169,203,238,.06) 120px 122px); }
.hx .container { position: relative; z-index: 2; width: 100%; padding-block: 72px 140px; display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
.hx .tag { display: inline-flex; align-items: center; gap: 10px; background: rgba(96,156,216,.16); border: 1px solid rgba(169,203,238,.35); color: #DCEAF8; font-size: 13.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px; }
.hx .tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--spark); box-shadow: 0 0 0 4px rgba(240,160,75,.25); }
.hx h1 { font-size: clamp(42px, 7.4vw, 92px); font-weight: 700; line-height: 1.12; letter-spacing: -.5px; max-width: 900px; }
.hx .en-sub { font-size: 14px; letter-spacing: 5px; color: var(--b-ice); font-weight: 500; }
.hx p { font-size: clamp(17px, 2vw, 20px); color: #D3DEEC; max-width: 620px; }
.hx .row { margin-top: 6px; }
.mouse { position: absolute; z-index: 2; bottom: 96px; inset-inline-start: 50%; transform: translateX(50%); width: 28px; height: 44px; border: 2px solid rgba(255,255,255,.55); border-radius: 16px; background: none; padding: 0; }
[dir="ltr"] .mouse { transform: translateX(-50%); }
.mouse::after { content: ""; position: absolute; top: 8px; inset-inline-start: 50%; width: 4px; height: 8px; margin-inline-start: -2px; border-radius: 2px; background: #fff; animation: wheel 1.8s infinite; }
@keyframes wheel { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(14px); } }

/* Stats card */
.stats2 { position: relative; z-index: 3; margin-top: calc(-1 * clamp(130px, 14vw, 170px)); margin-bottom: clamp(56px, 7vw, 88px); border-radius: 16px; padding: clamp(20px, 3vw, 34px); color: #fff; background: radial-gradient(60% 120% at 100% 0%, rgba(169,203,238,.35), transparent 60%), linear-gradient(135deg, var(--b-deep), var(--brand)); box-shadow: 0 24px 50px rgba(11,26,48,.28), inset 0 1px 0 rgba(255,255,255,.25); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.stats2 > div { display: flex; flex-direction: column; gap: 2px; padding-inline-start: 18px; border-inline-start: 1px solid rgba(255,255,255,.22); }
.stats2 > div:first-child { border-inline-start: 0; padding-inline-start: 0; }
.stats2 strong { font-size: clamp(30px, 4vw, 44px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stats2 > div > span { font-size: 14px; color: #DCEAF8; }
.stats-note { font-size: 12px; color: var(--steel); margin-top: -64px; margin-bottom: 40px; }

/* Services bento */
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 230px; gap: 14px; }
.bento .t { position: relative; overflow: hidden; border-radius: 14px; border: 0; padding: 0; text-align: start; color: #fff; background: var(--navy-2); }
.bento .t:nth-child(1) { grid-column: span 2; grid-row: span 2; }
.bento .t:nth-child(4), .bento .t:nth-child(5), .bento .t:nth-child(6) { grid-column: span 2; }
.bento .t:nth-child(5) { grid-column: span 2; }
.bento .t img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .7s cubic-bezier(.2,.7,.2,1), opacity .5s; }
.bento .t:hover img { transform: scale(1.07); }
.t-ov { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(11,26,48,.92) 0%, rgba(11,26,48,.35) 55%, rgba(38,76,138,.15) 100%); transition: background .3s; }
.bento .t:hover .t-ov { background: linear-gradient(0deg, rgba(11,26,48,.92) 0%, rgba(38,76,138,.55) 60%, rgba(60,108,180,.35) 100%); }
.t-tx { position: absolute; inset-inline: 20px; bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
.t-tx strong { font-size: 21px; line-height: 1.3; }
.bento .t:nth-child(1) .t-tx strong { font-size: clamp(26px, 3vw, 34px); }
.t-d { color: #D3DEEC; font-size: 15px; max-width: 420px; }
.chip2 { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); }
.t-go { position: absolute; top: 16px; inset-inline-end: 16px; width: 42px; height: 42px; border-radius: 50%; background: #fff; color: var(--brand); display: flex; align-items: center; justify-content: center; transform: scale(.6); opacity: 0; transition: transform .25s, opacity .25s; }
.bento .t:hover .t-go, .bento .t:focus-visible .t-go { transform: none; opacity: 1; }

/* Project cards with photo stack */
.stack { position: absolute; inset: 0; }
.stack img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s, transform .8s cubic-bezier(.2,.7,.2,1); }
.stack img.ld.on { opacity: 1; }
.pc { position: relative; overflow: hidden; border-radius: 14px; border: 0; padding: 0; text-align: start; color: #fff; background: var(--navy-2); display: block; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); transition: transform .3s, box-shadow .3s; }
.pc:hover { transform: translateY(-6px); box-shadow: 0 22px 40px rgba(0,0,0,.35); }
.pc:hover .stack img.on { transform: scale(1.05); }
.pc-ov { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(7,18,34,.95) 0%, rgba(7,18,34,.4) 45%, transparent 75%); }
.pc-tx { position: absolute; inset-inline: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 6px; transition: transform .3s; }
.pc:hover .pc-tx { transform: translateY(-38px); }
.pc-svc { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 4px; background: var(--brand); }
.pc-tx strong { font-size: 20px; line-height: 1.35; }
.pc-meta { font-size: 14px; color: #C9D6E6; }
.pc-go { position: absolute; inset-inline: 20px; bottom: 18px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--b-ice); opacity: 0; transform: translateY(10px); transition: opacity .3s, transform .3s; }
.pc:hover .pc-go, .pc:focus-visible .pc-go { opacity: 1; transform: none; }
.dots { position: absolute; top: 14px; inset-inline-end: 14px; display: flex; gap: 5px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.4); transition: background .3s, width .3s; }
.dots i.on { background: #fff; width: 18px; border-radius: 4px; }

/* Featured showcase */
.feat { width: 100%; height: clamp(380px, 46vw, 560px); }
.feat .pc-tx { inset-inline: clamp(20px, 4vw, 48px); bottom: clamp(24px, 4vw, 44px); gap: 10px; max-width: 640px; }
.feat .pc-tx strong { font-size: clamp(28px, 4vw, 46px); }
.feat .pc-go { inset-inline: clamp(20px, 4vw, 48px); bottom: clamp(24px, 4vw, 44px); }
.feat .badge-f { align-self: flex-start; display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: rgba(240,160,75,.18); color: #FFD6A8; border: 1px solid rgba(240,160,75,.4); }
.strip { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-block: 24px 10px; margin-top: 4px; cursor: grab; }
.strip::-webkit-scrollbar { display: none; }
.strip.drag { cursor: grabbing; scroll-snap-type: none; }
.strip.drag .pc { pointer-events: none; }
.strip .pc { flex: 0 0 clamp(270px, 30vw, 360px); height: 430px; scroll-snap-align: start; }
.strip-ctl { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.prog2 { flex: 1; height: 3px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
.prog2 i { display: block; height: 100%; width: 20%; background: linear-gradient(90deg, var(--b-light), #fff); border-radius: 3px; transition: width .15s; }
.cbtn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.06); color: #fff; display: flex; align-items: center; justify-content: center; }
.cbtn:hover { background: var(--brand); border-color: var(--brand); }

/* Process timeline */
.tl { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; position: relative; }
.tl::before { content: ""; position: absolute; top: 27px; inset-inline: 12.5%; height: 2px; background: linear-gradient(90deg, var(--b-light), var(--brand), var(--b-deep)); }
.tl li { display: flex; flex-direction: column; gap: 14px; position: relative; }
.tl .num { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; align-self: center; font-weight: 700; font-size: 18px; color: #fff; background: linear-gradient(135deg, var(--b-light), var(--b-deep)); box-shadow: 0 0 0 6px #fff, 0 0 0 7px var(--b-mist-2), 0 10px 20px rgba(38,76,138,.3); position: relative; z-index: 1; }
.tl .ph { height: 170px; border-radius: 12px; overflow: hidden; background: var(--b-mist); position: relative; }
.tl .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
.tl li:hover .ph img { transform: scale(1.06); }
.tl strong { font-size: 20px; color: var(--navy); }
.tl p { color: var(--ink-2); font-size: 15px; }

/* Why */
.why { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.why > div { border-radius: 14px; padding: 24px 22px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); display: flex; flex-direction: column; gap: 10px; transition: background .25s, transform .25s; }
.why > div:hover { background: rgba(255,255,255,.12); transform: translateY(-4px); }
.why .ico { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(255,255,255,.25), rgba(255,255,255,.06)); border: 1px solid rgba(255,255,255,.3); color: #fff; }
.why strong { font-size: 19px; }
.why p { color: #DCEAF8; font-size: 15px; }

/* Clients marquee */
.mq { overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.mq-track { display: flex; gap: 16px; width: max-content; animation: mq 34s linear infinite; }
[dir="rtl"] .mq-track { animation-name: mqr; }
.mq:hover .mq-track { animation-play-state: paused; }
@keyframes mq { to { transform: translateX(-50%); } }
@keyframes mqr { to { transform: translateX(50%); } }
.cl { flex: none; height: 92px; min-width: 210px; padding: 0 26px; border-radius: 12px; background: #fff; border: 1px solid var(--b-mist-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--steel); font-weight: 700; font-size: 16px; }
.cl small { font-size: 11px; font-weight: 500; color: var(--steel-2); }

/* Track (portal) */
.track2 { display: flex; flex-wrap: wrap; gap: 36px; align-items: center; justify-content: space-between; border-radius: 18px; padding: clamp(24px, 4vw, 44px); background: linear-gradient(135deg, var(--b-mist), #fff); border: 1px solid var(--b-mist-2); }
.track2 ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; flex: 1 1 300px; }
.track2 li { display: flex; gap: 12px; align-items: center; }

/* Contact */
.ct { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; }
.ct-info { flex: 1 1 320px; display: flex; flex-direction: column; gap: 16px; }
.ct-line { display: flex; gap: 12px; align-items: center; color: #D3DEEC; font-size: 15px; }
.ct-line i { width: 40px; height: 40px; border-radius: 10px; flex: none; display: flex; align-items: center; justify-content: center; background: rgba(96,156,216,.16); color: var(--b-ice); font-style: normal; }
.ct-card { flex: 1 1 440px; background: #fff; color: var(--ink); border-radius: 16px; padding: clamp(20px, 3vw, 32px); box-shadow: 0 30px 60px rgba(0,0,0,.3); border-top: 4px solid var(--brand); }
.ct-card .field input, .ct-card .field select, .ct-card .field textarea { border-color: #CBD5E1; transition: border-color .2s, box-shadow .2s; }
.ct-card .field input:focus, .ct-card .field select:focus, .ct-card .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(60,108,180,.18); }
.ct-card .field [aria-invalid="true"] { border-color: var(--red); box-shadow: 0 0 0 4px rgba(163,58,42,.12); }
.ferr { font-size: 12.5px; font-weight: 500; color: var(--red-ink); }
.sent { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding-block: 28px; }
.sent .okc { width: 64px; height: 64px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: flex; align-items: center; justify-content: center; }

/* Footer */
.foot2 { background: var(--navy-3); color: #B9C6D6; font-size: 14px; position: relative; }
.foot2::before { content: ""; position: absolute; inset-inline: 0; top: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(96,156,216,.6), transparent); }
.foot2 .grid3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 32px; padding-block: 48px 28px; }
.foot2 .plate { align-self: flex-start; background: #fff; border-radius: 10px; padding: 8px 12px; display: inline-flex; }
.foot2 .plate img { height: 56px; width: auto; }
.foot2 h4 { margin: 0 0 10px; color: #fff; font-size: 15px; }
.foot2 button { background: none; border: 0; padding: 4px 0; color: #B9C6D6; font-size: 14px; display: block; text-align: start; }
.foot2 button:hover { color: #fff; }
.foot2 .base { border-top: 1px solid rgba(255,255,255,.08); padding-block: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font-size: 13px; color: #8FA0B5; }
.mbar { display: none; }
.acts-in { display: flex; gap: 8px; align-items: center; }

@media (max-width: 960px) {
  .sh nav, .sh .acts .hide-m { display: none; }
  .burger { display: flex; }
  .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 200px; }
  .bento .t:nth-child(n) { grid-column: span 1; grid-row: span 1; }
  .bento .t:nth-child(1) { grid-column: span 2; grid-row: span 1; height: auto; }
  .tl { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 36px; }
  .tl::before { display: none; }
  .why { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats2 > div:nth-child(3) { border-inline-start: 0; padding-inline-start: 0; }
  .foot2 .grid3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .sh { position: relative; top: 0; }

.tl.tlg::after { content: ""; position: absolute; top: 27px; inset-inline: 12.5%; height: 2px; z-index: 0; background: linear-gradient(90deg, var(--b-light), var(--brand), var(--b-deep)); transform: scaleX(var(--tl, 0)); transform-origin: left center; box-shadow: 0 0 12px rgba(96,156,216,.6); }

.tl.tlg li { z-index: 1; }
.tl.tlg .num { transition: transform .45s cubic-bezier(.2,.7,.2,1), box-shadow .45s, filter .45s; filter: saturate(.4) brightness(1.1); }
.tl.tlg li.on .num { filter: none; transform: scale(1.08); box-shadow: 0 0 0 8px rgba(96,156,216,.16), 0 10px 24px rgba(38,76,138,.35); }
.mq.mqg .mq-track { animation: none; }
@media (max-width: 960px) { .tl.tlg::after { display: none; } .tl.tlg .num { filter: none; } }
@media (prefers-reduced-motion: reduce) { .shine, .glowb::before { animation: none; } .hx-aur { display: none; } }

.fol { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; border-top: 1px solid #EEF2F7; padding-top: 10px; }

.admin .rv { opacity: 1; transform: none; transition: none; animation: rise .5s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@media (prefers-reduced-motion: reduce) { .admin .rv { animation: none; } }
.donut > div .small { font-size: 11px; line-height: 1.35; padding: 0 8px; }
.donut { width: 170px; height: 170px; }


@media (max-width: 560px) { .form, .typegrid { grid-template-columns: minmax(0, 1fr); } .logo { height: 72px; } }
@media (prefers-reduced-motion: reduce) { .chip { transition: none; } }

    const errs = { name: name ? '' : T('اكتب اسمك.', 'Enter your name.'), phone: /^(05\d{8}|(\+?966)5\d{8})$/.test(phone) ? '' : T('رقم جوال سعودي يبدأ بـ 05 من ١٠ أرقام.', 'A Saudi mobile number starting with 05, 10 digits.') };
    ['name', 'phone'].forEach((k) => { g('q-' + k).setAttribute('aria-invalid', errs[k] ? 'true' : 'false'); g('e-' + k).textContent = errs[k]; });
    if (errs.name || errs.phone) { g(errs.name ? 'q-name' : 'q-phone').focus(); return; }
    if (has('quotes')) { S.quotes.unshift({ id: 'r' + (S.nextId++), name: [name, name], phone: phone, svc: g('q-svc').value, city: g('q-city').value || '—', when: ['الآن', 'Just now'], age: 0, status: 'جديد', owner: '' }); toast(T('وصل الطلب إلى «طلبات عروض الأسعار» في لوحة التحكم، ومعه إشعار واتساب.', 'The request reached «Quote requests» in the dashboard, with a WhatsApp alert.')); }
    else toast(T('وصل الطلب إلى واتساب المصنع وبريده.', 'The request was sent to the factory WhatsApp and email.'));
    S.qSent = true; render(true);
  });

  render();
})();
</script>
